[project]
name = "youtube-recap"
version = "0.1.0"
description = "MCP server that searches YouTube, extracts transcripts, and summarizes videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "yt-dlp>=2024.1.0",
    "youtube-transcript-api>=1.0.0",
    # Make Python's ssl use the OS trust store (this network intercepts TLS).
    "truststore>=0.9.0",
]

[project.scripts]
youtube-recap = "youtube_recap.server:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.uv]
# This network intercepts TLS, so uv must trust the system certificate store.
native-tls = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_recap"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# A sensible, not-overbearing set: pyflakes/pycodestyle, import sorting,
# pyupgrade, bugbear, and simplify.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
