[project]
name = "youtube-recap"
version = "0.1.0"
description = "MCP server that searches YouTube and returns transcripts for an assistant to summarize."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "yt-dlp>=2026.7.4",
    "youtube-transcript-api>=1.0.0",
    # Make Python's ssl use the OS trust store (this network intercepts TLS).
    "truststore>=0.9.0",
]

[project.scripts]
youtube-recap = "youtube_recap.server:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[tool.uv]
# This network intercepts TLS, so uv must trust the system certificate store.
system-certs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_recap"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# A sensible, not-overbearing set: pyflakes/pycodestyle, import sorting,
# pyupgrade, bugbear, and simplify.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: calls the real YouTube (deselected by default; run with -m live)"]

[tool.coverage.run]
source = ["youtube_recap"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# yt-dlp ships no type hints.
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true
