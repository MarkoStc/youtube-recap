name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: youtube-recap:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image imports the package and runs as non-root
        run: |
          docker run --rm --entrypoint python youtube-recap:ci -c "import youtube_recap"
          docker run --rm youtube-recap:ci --version
          test "$(docker run --rm --entrypoint id youtube-recap:ci -u)" != "0"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv export --locked --no-dev --all-extras --no-emit-project --no-hashes --format requirements-txt > requirements.txt
      - run: uvx pip-audit --requirement requirements.txt --no-deps --disable-pip
