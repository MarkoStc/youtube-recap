# Default settings for youtube-recap. This file is the single source of every limit and
# default. To change values, write a YAML file with only the keys you want to override and
# point YOUTUBE_RECAP_CONFIG (or the CLI --config flag) at it; it is merged over this file.

search:
  default_results: 10    # search_videos max_results when the caller gives none
  max_results: 50        # hard cap per search call

recap:
  default_videos: 3      # videos summarized when the caller gives none
  max_videos: 10
  default_search_pool: 10  # results searched before keeping the most viewed
  max_transcript_chars: 8000  # per video, to bound the client's token use

transcripts:
  languages: [en]        # preferred transcript languages, in order
  # When none of those exist: "translate" (YouTube machine translation into the first
  # language, else the original), "original" (first available language), or "none".
  fallback: translate

network:
  timeout_seconds: 20    # per HTTP request (yt-dlp socket timeout, transcript requests)
  use_os_trust_store: true  # verify TLS with the OS certificate store (truststore)
  retry:
    attempts: 3          # total tries for transient failures (timeouts, 5xx, 429)
    initial_backoff_seconds: 1.0
    max_backoff_seconds: 10.0
    multiplier: 2.0

rate_limit:               # shared by search and transcript requests to YouTube
  enabled: true
  requests_per_second: 2.0
  burst: 5                 # requests allowed back to back before the rate applies

cache:
  enabled: true
  directory: ~/.cache/youtube-recap
  search_ttl_seconds: 3600        # 1 hour: view counts and results change
  transcript_ttl_seconds: 604800  # 7 days: captions rarely change

evaluation:              # only used by `youtube-recap eval` (needs the `eval` extra)
  summarizer:            # stands in for the MCP client that writes the recap
    model: claude-opus-5-5
    effort: medium
    max_tokens: 16000
  judge:                 # decides which reference key points a summary covers
    model: claude-opus-5-5
    effort: medium
    max_tokens: 16000
  summary_max_words: 250 # length limit given to the summarizer, so coverage is comparable
  server_side_fallback: true  # let the API retry a refused request on another model

logging:
  level: INFO            # DEBUG, INFO, WARNING, ERROR
  format: text           # text or json; always written to stderr
